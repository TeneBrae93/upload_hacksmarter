{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center h-screen" style="margin-top: -10vh;">
    <div class="glass-panel" style="width: 100%; max-width: 450px;">
        <div class="text-center mb-4">
            <h2>Set up Multi-Factor Authentication</h2>
            <p style="color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.9rem;">Scan the QR code with your authenticator app (like Authy or Google Authenticator).</p>
        </div>
        
        <div class="text-center mb-4" style="background: white; padding: 1rem; border-radius: 8px; display: inline-block; width: 100%;">
            <img src="{{ url_for('qr_code') }}" alt="QR Code" style="max-width: 200px; height: auto;">
        </div>
        
        <div class="text-center mb-4">
            <p style="color: var(--text-secondary); font-size: 0.8rem; word-break: break-all;">Manual entry code: <strong>{{ secret }}</strong></p>
        </div>
        
        <form method="POST" action="{{ url_for('setup_mfa') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="token">Enter 6-digit code</label>
                <input type="text" id="token" name="token" required autocomplete="off" maxlength="6" pattern="\d{6}" style="text-align: center; letter-spacing: 0.5rem; font-size: 1.5rem;">
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Verify and Enable MFA</button>
        </form>
    </div>
</div>
{% endblock %}
