{% extends "base.html" %}

{% block content %}
<main class="form-container">
    <div class="glass-panel text-center">
        <i class="fas fa-user-shield fa-3x mb-3 text-primary"></i>
        <h1 class="h3 mb-3 fw-normal">Update Password</h1>
        <p class="text-muted small mb-4">Please enter your current password, your new password, and your Authenticator Code to confirm.</p>

        <form method="POST" action="{{ url_for('update_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="current_password" name="current_password" placeholder="Current Password" required>
                <label for="current_password">Current Password</label>
            </div>
            
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="new_password" name="new_password" placeholder="New Password" required>
                <label for="new_password">New Password</label>
            </div>
            
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                <label for="confirm_password">Confirm New Password</label>
            </div>

            <div class="form-floating mb-4">
                <input type="text" class="form-control" id="mfa_token" name="mfa_token" placeholder="6-digit Code" required pattern="[0-9]{6}" maxlength="6">
                <label for="mfa_token">MFA Code</label>
            </div>

            <button class="btn btn-primary w-100 py-2" type="submit">Update Password</button>
            <div class="mt-3">
                <a href="{{ url_for('dashboard') }}" class="text-muted small text-decoration-none">Cancel & Return to Dashboard</a>
            </div>
        </form>
    </div>
</main>
{% endblock %}
