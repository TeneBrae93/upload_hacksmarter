{% extends "base.html" %}

{% block content %}
<main style="max-width: 500px; margin: 0 auto; width: 100%;">
    <div class="glass-panel text-center">
        <i class="fas fa-key fa-3x" style="color: var(--primary-color); margin-bottom: 1rem;"></i>
        <h2 style="margin-bottom: 0.5rem;">Update Password</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.9rem;">Please set a new secure password to continue.</p>
        
        <form method="POST" action="{{ url_for('change_password') }}" style="text-align: left;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="New Password" required>
            </div>
            
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
            </div>

            <button class="btn btn-solid" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-bottom: 1rem;" type="submit">Update Password</button>
            <div style="text-align: center;">
                <a href="{{ url_for('logout') }}" style="color: var(--text-secondary); font-size: 0.9rem; text-decoration: none;">Cancel & Logout</a>
            </div>
        </form>
    </div>
</main>
{% endblock %}
