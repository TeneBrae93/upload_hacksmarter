{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center h-screen" style="margin-top: -10vh;">
    <div class="glass-panel" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h2 style="font-size: 2rem; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Hack Smarter</h2>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Secure OVA Upload Portal</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>
    </div>
</div>
{% endblock %}
